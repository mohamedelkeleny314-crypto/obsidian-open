<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فتح في Obsidian</title>
<style>
  :root { --bg:#ffffff; --fg:#1c1c1c; --muted:#6b6b6b; --accent:#7c3aed; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1c; --fg:#f2f2f2; --muted:#a0a0a0; --accent:#a78bfa; }
  }
  html, body { height:100%; margin:0; }
  body {
    display:flex; align-items:center; justify-content:center; text-align:center;
    background:var(--bg); color:var(--fg);
    font-family:system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  main { padding:24px; max-width:420px; }
  h1 { font-size:1.3rem; margin:0 0 8px; }
  p { color:var(--muted); margin:6px 0 20px; word-break:break-word; }
  a.btn {
    display:inline-block; padding:12px 24px; border-radius:10px;
    background:var(--accent); color:#fff; text-decoration:none; font-weight:600;
  }
</style>
</head>
<body>
<main>
  <h1 id="title">جارٍ فتح Obsidian…</h1>
  <p id="note"></p>
  <a id="open" class="btn" href="#">افتح يدوياً</a>
</main>
<script>
  // الاستخدام:  ?file=اسم الكتاب        (أو مسار كامل مع المجلد)
  // اختياري:    &vault=اسم الخزنة       (الافتراضي: test)
  var DEFAULT_VAULT = "test";

  var params = new URLSearchParams(location.search);
  var file = params.get("file");
  var vault = params.get("vault") || DEFAULT_VAULT;

  var url = "obsidian://open?vault=" + encodeURIComponent(vault);
  if (file) url += "&file=" + encodeURIComponent(file);

  document.getElementById("open").href = url;
  document.getElementById("note").textContent = file ? file : "لم يتم تحديد ملف، سيتم فتح الخزنة فقط.";

  setTimeout(function () {
    document.getElementById("title").textContent = "إن لم يفتح Obsidian تلقائياً، اضغط الزر";
  }, 2000);

  window.location.href = url;
</script>
</body>
</html>
